spring.application.name=securevault

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/securevault}
spring.datasource.username=${DB_USERNAME:securevault}
spring.datasource.password=${DB_PASSWORD:changeme}

# Schema is owned by Flyway migrations, NEVER auto-generated -- see README
spring.jpa.hibernate.ddl-auto=validate
# Deliberately off -- see README "OSIV" section
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# NEVER commit a real secret -- this default is for local dev only.
# In any real deployment this MUST come from an env var / secrets manager.
securevault.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24tMTIzNA==}
# 15 minutes
securevault.jwt.access-token-ttl-seconds=${JWT_ACCESS_TTL:900}
# 14 days
securevault.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TTL:1209600}

management.endpoints.web.exposure.include=health,info,prometheus
